---
- name: Install Nginx and authentication utilities
  ansible.builtin.apt:
    name:
      - nginx
      - apache2-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify the current Harness HTTP password
  ansible.builtin.command:
    argv:
      - htpasswd
      - -vbi
      - /etc/nginx/deepseek-harness.htpasswd
      - "{{ dsh_web_username }}"
    stdin: "{{ dsh_web_password }}"
  register: nginx_password_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Write the Harness HTTP password file
  ansible.builtin.command:
    argv:
      - htpasswd
      - -cbi
      - /etc/nginx/deepseek-harness.htpasswd
      - "{{ dsh_web_username }}"
    stdin: "{{ dsh_web_password }}"
  when: nginx_password_check.rc != 0
  no_log: true
  notify: reload nginx

- name: Protect the Harness HTTP password file
  ansible.builtin.file:
    path: /etc/nginx/deepseek-harness.htpasswd
    owner: root
    group: www-data
    mode: '0640'

- name: Render the DeepSeek Harness Nginx site
  ansible.builtin.template:
    src: deepseek-harness.conf.j2
    dest: /etc/nginx/sites-available/deepseek-harness
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable the DeepSeek Harness Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/deepseek-harness
    dest: /etc/nginx/sites-enabled/deepseek-harness
    state: link
    force: true
  notify: reload nginx

- name: Enable and start Nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    enabled: true
    state: started
