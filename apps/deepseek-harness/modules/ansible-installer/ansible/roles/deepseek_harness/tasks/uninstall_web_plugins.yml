---
- name: Create the DeepSeek Harness Web Profile directory for plugin removal
  ansible.builtin.file:
    path: "{{ dsh_state_dir }}/profiles/web"
    state: directory
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
  become_user: "{{ dsh_user }}"

- name: Check requested DeepSeek Harness Web Profile plugin removals
  ansible.builtin.command:
    argv:
      - "{{ dsh_node_bin | default('/usr/local/bin/node') }}"
      - -e
      - |
        const fs = require("node:fs");
        const manifestPath = process.argv[1];
        const packageName = process.argv[2];
        if (!fs.existsSync(manifestPath)) process.exit(1);
        const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
        process.exit(Object.prototype.hasOwnProperty.call(manifest.dependencies ?? {}, packageName) ? 0 : 1);
      - "{{ dsh_state_dir }}/profiles/web/package.json"
      - "{{ item }}"
  args:
    chdir: "{{ dsh_workspace_dir }}"
  environment:
    HOME: "{{ dsh_home }}"
    DSH_HOME: "{{ dsh_state_dir }}"
    PNPM_CONFIG_STORE_DIR: "{{ dsh_pnpm_store_dir }}"
  become_user: "{{ dsh_user }}"
  loop: "{{ dsh_web_plugins_to_remove | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: dsh_web_plugin_removal_state
  changed_when: false
  failed_when: false

- name: Remove requested DeepSeek Harness Web Profile plugins
  ansible.builtin.command:
    argv:
      - "{{ dsh_pnpm_bin | default('/usr/local/bin/pnpm') }}"
      - dlx
      - --allow-build=node-pty
      - "@deepseek-ai/dsh@{{ dsh_version }}"
      - plugin
      - --profile
      - web
      - remove
      - "{{ dsh_web_plugin_to_remove }}"
  args:
    chdir: "{{ dsh_workspace_dir }}"
  environment:
    HOME: "{{ dsh_home }}"
    DSH_HOME: "{{ dsh_state_dir }}"
    PNPM_CONFIG_STORE_DIR: "{{ dsh_pnpm_store_dir }}"
  become_user: "{{ dsh_user }}"
  loop: "{{ dsh_web_plugin_removal_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0
  vars:
    dsh_web_plugin_to_remove: "{{ item.item }}"
  notify: restart deepseek harness
