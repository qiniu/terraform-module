---
- name: Create managed Skill directories
  ansible.builtin.file:
    path: "{{ dsh_home }}/.agents/skills/{{ item }}/scripts"
    state: directory
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
  loop:
    - "{{ las_dsh_environment_skill_name }}"
    - "{{ las_static_preview_skill_name }}"
    - "{{ las_preview_ports_skill_name }}"

- name: Render the LAS deployment environment Skill
  ansible.builtin.template:
    src: las_dsh_environment/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/{{ las_dsh_environment_skill_name }}/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'

- name: Render the LAS Static Preview Skill
  ansible.builtin.template:
    src: las_static_preview/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/{{ las_static_preview_skill_name }}/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'

- name: Render the LAS Static Preview publish script
  ansible.builtin.template:
    src: las_static_preview/publish.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/{{ las_static_preview_skill_name }}/scripts/publish.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'

- name: Render the LAS Preview ports Skill
  ansible.builtin.template:
    src: las_preview_ports/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/{{ las_preview_ports_skill_name }}/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'

- name: Render the LAS Preview port management script
  ansible.builtin.template:
    src: las_preview_ports/manage-preview-port.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/{{ las_preview_ports_skill_name }}/scripts/manage-preview-port.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
