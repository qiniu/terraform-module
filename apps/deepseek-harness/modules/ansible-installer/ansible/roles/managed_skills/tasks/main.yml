---
- name: Remove superseded managed Skill directories
  ansible.builtin.file:
    path: "{{ dsh_home }}/.agents/skills/{{ item }}"
    state: absent
  loop:
    - las_dsh_environment
    - las_static_preview
    - las_preview_ports
    - las_filebrowser_share

- name: Remove the FileBrowser sharing Skill when FileBrowser is disabled
  ansible.builtin.file:
    path: "{{ dsh_home }}/.agents/skills/las-filebrowser-share"
    state: absent
  when: not (enable_filebrowser | bool)

- name: Create managed Skill directories
  ansible.builtin.file:
    path: "{{ dsh_home }}/.agents/skills/{{ item }}/scripts"
    state: directory
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
  loop:
    - las-dsh-environment
    - las-static-preview
    - las-preview-ports

- name: Create the FileBrowser sharing Skill directory
  ansible.builtin.file:
    path: "{{ dsh_home }}/.agents/skills/las-filebrowser-share/scripts"
    state: directory
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
  when: enable_filebrowser | bool

- name: Render the LAS deployment environment Skill
  ansible.builtin.template:
    src: las-dsh-environment/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/las-dsh-environment/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'

- name: Render the LAS session summary script
  ansible.builtin.template:
    src: las-dsh-environment/inspect-session.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/las-dsh-environment/scripts/inspect-session.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'

- name: Render the LAS Static Preview Skill
  ansible.builtin.template:
    src: las-static-preview/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/las-static-preview/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'

- name: Render the LAS Static Preview publish script
  ansible.builtin.template:
    src: las-static-preview/publish.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/las-static-preview/scripts/publish.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'

- name: Render the LAS Static Preview unpublish script
  ansible.builtin.template:
    src: las-static-preview/unpublish.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/las-static-preview/scripts/unpublish.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'

- name: Render the LAS Preview ports Skill
  ansible.builtin.template:
    src: las-preview-ports/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/las-preview-ports/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'

- name: Render the LAS Preview port management script
  ansible.builtin.template:
    src: las-preview-ports/manage-preview-port.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/las-preview-ports/scripts/manage-preview-port.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'

- name: Render the FileBrowser sharing Skill
  ansible.builtin.template:
    src: las-filebrowser-share/SKILL.md.j2
    dest: "{{ dsh_home }}/.agents/skills/las-filebrowser-share/SKILL.md"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0600'
  when: enable_filebrowser | bool

- name: Render the FileBrowser sharing helper
  ansible.builtin.template:
    src: las-filebrowser-share/filebrowser-share.sh.j2
    dest: "{{ dsh_home }}/.agents/skills/las-filebrowser-share/scripts/filebrowser-share.sh"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
  when: enable_filebrowser | bool

- name: Install the FileBrowser sharing Python implementation
  ansible.builtin.copy:
    src: las-filebrowser-share/filebrowser-share.py
    dest: "{{ dsh_home }}/.agents/skills/las-filebrowser-share/scripts/filebrowser-share.py"
    owner: "{{ dsh_user }}"
    group: "{{ dsh_group }}"
    mode: '0700'
  when: enable_filebrowser | bool
