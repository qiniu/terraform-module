---
- name: Verify DeepSeek Harness Web Profile plugin installation
  hosts: localhost
  connection: local
  gather_facts: true
  handlers:
    - name: restart deepseek harness
      ansible.builtin.debug:
        msg: fake restart
  tasks:
    - name: Create a temporary Web Profile test workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: las-dsh-web-plugins-
      register: web_plugin_test_root

    - name: Verify Web Profile plugin installation
      block:
        - name: Set test paths
          ansible.builtin.set_fact:
            dsh_home: "{{ web_plugin_test_root.path }}/home"
            dsh_state_dir: "{{ web_plugin_test_root.path }}/home/.dsh"
            dsh_workspace_dir: "{{ web_plugin_test_root.path }}/workspace"
            dsh_pnpm_store_dir: "{{ web_plugin_test_root.path }}/home/.pnpm-store"
            dsh_user: "{{ ansible_facts['user_id'] }}"
            dsh_group: "{{ ansible_facts['user_id'] }}"
            dsh_web_plugins:
              - dshmarket@1.64.0
              - dsh-better-sidebar@0.21.1
              - https://github.com/example/dsh-plugin/releases/download/v1.0.0/plugin-1.0.0.tgz
              - /opt/las-dsh-plugins/dsh-auth-bootstrap
            dsh_web_plugins_to_remove:
              - dshmarket
              - old-plugin
            dsh_pnpm_minimum_release_age_exclude:
              - dshmarket
              - dsh-better-sidebar
            dsh_version: 0.1.7-rc.1
            dsh_pnpm_resolution_mode: time-based
            dsh_pnpm_dlx_allowed_builds:
              - node-pty
              - '@deepseek-ai/dsh-subprocess-local'
              - koffi
              - '@google/genai'
              - protobufjs
            dsh_node_bin: node
            dsh_pnpm_bin: "{{ web_plugin_test_root.path }}/fake-pnpm"

        - name: Create the profile and workspace directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0700'
          loop:
            - "{{ dsh_state_dir }}/profiles/web"
            - "{{ dsh_workspace_dir }}"

        - name: Create a pnpm workspace with an unresolved build policy
          ansible.builtin.copy:
            content: |
              packages:
                - .

              nodeLinker: hoisted
              autoInstallPeers: false
              allowBuilds:
                node-pty: set this to true or false
            dest: "{{ dsh_state_dir }}/profiles/web/pnpm-workspace.yaml"
            mode: '0600'

        - name: Create an empty Web Profile manifest
          ansible.builtin.copy:
            content: "{\"name\":\"web\",\"dependencies\":{\"dshmarket\":\"1.37.0\",\"dsh-better-sidebar\":\"0.17.1\"},\"dsh\":{\"profile\":{\"bundles\":[\"dshmarket\",\"dsh-better-sidebar\"]}}}\n"
            dest: "{{ dsh_state_dir }}/profiles/web/package.json"
            mode: '0600'

        - name: Create a fake pnpm command
          ansible.builtin.copy:
            content: |
              #!/usr/bin/env bash
              set -euo pipefail
              manifest="${DSH_HOME}/profiles/web/package.json"
              printf '%s\n' "$*" >> "${DSH_HOME}/plugin-install.log"
              printf '%s\n' "${PNPM_CONFIG_RESOLUTION_MODE:-}" >> "${DSH_HOME}/resolution-mode.log"
              plugin="${!#}"
              if [[ " $* " =~ " plugin --profile web remove " ]]; then
                exit 0
              fi
              node - "${manifest}" "${plugin}" <<'NODE'
              const fs = require("node:fs");
              const [manifestPath, packageName] = process.argv.slice(2);
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              manifest.dependencies ??= {};
              let installedName = packageName;
              if (packageName.startsWith("https://")) {
                installedName = "@example/dsh-plugin";
              } else if (packageName.startsWith("/")) {
                installedName = "las-dsh-auth-bootstrap";
              }
              manifest.dependencies[installedName] = packageName.startsWith("/")
                ? `link:${packageName}`
                : packageName;
              manifest.dsh ??= {};
              manifest.dsh.profile ??= {};
              manifest.dsh.profile.bundles ??= [];
              if (!manifest.dsh.profile.bundles.includes(installedName)) {
                manifest.dsh.profile.bundles.push(installedName);
              }
              fs.writeFileSync(manifestPath, `${JSON.stringify(manifest)}\n`);
              NODE
            dest: "{{ dsh_pnpm_bin }}"
            mode: '0700'

        - name: Install the configured plugins for the first time
          ansible.builtin.include_tasks: ../roles/deepseek_harness/tasks/uninstall_web_plugins.yml

        - name: Install the configured plugins for the first time
          ansible.builtin.include_tasks: ../roles/deepseek_harness/tasks/install_web_plugins.yml

        - name: Read the first installation log
          ansible.builtin.slurp:
            src: "{{ dsh_state_dir }}/plugin-install.log"
          register: first_plugin_install_log

        - name: Read the pnpm workspace build policy
          ansible.builtin.slurp:
            src: "{{ dsh_state_dir }}/profiles/web/pnpm-workspace.yaml"
          register: pnpm_workspace

        - name: Read the pnpm resolution mode log
          ansible.builtin.slurp:
            src: "{{ dsh_state_dir }}/resolution-mode.log"
          register: pnpm_resolution_mode_log

        - name: Verify both plugins were installed with the expected command
          ansible.builtin.assert:
            that:
              - "(first_plugin_install_log.content | b64decode).splitlines() == ['dlx --allow-build=node-pty --allow-build=@deepseek-ai/dsh-subprocess-local --allow-build=koffi --allow-build=@google/genai --allow-build=protobufjs @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile web remove dshmarket', 'dlx --allow-build=node-pty --allow-build=@deepseek-ai/dsh-subprocess-local --allow-build=koffi --allow-build=@google/genai --allow-build=protobufjs @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile web add dshmarket@1.64.0', 'dlx --allow-build=node-pty --allow-build=@deepseek-ai/dsh-subprocess-local --allow-build=koffi --allow-build=@google/genai --allow-build=protobufjs @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile web add dsh-better-sidebar@0.21.1', 'dlx --allow-build=node-pty --allow-build=@deepseek-ai/dsh-subprocess-local --allow-build=koffi --allow-build=@google/genai --allow-build=protobufjs @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile web add https://github.com/example/dsh-plugin/releases/download/v1.0.0/plugin-1.0.0.tgz', 'dlx --allow-build=node-pty --allow-build=@deepseek-ai/dsh-subprocess-local --allow-build=koffi --allow-build=@google/genai --allow-build=protobufjs @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile web add /opt/las-dsh-plugins/dsh-auth-bootstrap']"
              - "'node-pty: true' in (pnpm_workspace.content | b64decode)"
              - "'minimumReleaseAgeExclude:' in (pnpm_workspace.content | b64decode)"
              - "'  - \"dshmarket\"' in (pnpm_workspace.content | b64decode)"
              - "'  - \"dsh-better-sidebar\"' in (pnpm_workspace.content | b64decode)"
              - "(pnpm_resolution_mode_log.content | b64decode).splitlines() == ['time-based', 'time-based', 'time-based', 'time-based', 'time-based']"

        - name: Simulate the package manifest written by the plugin upgrade
          ansible.builtin.copy:
            dest: "{{ dsh_state_dir }}/profiles/web/package.json"
            content: "{\"name\":\"web\",\"dependencies\":{\"dshmarket\":\"^1.64.0\",\"dsh-better-sidebar\":\"^0.21.1\",\"example-plugin\":\"https://github.com/example/dsh-plugin/releases/download/v1.0.0/plugin-1.0.0.tgz\",\"las-dsh-auth-bootstrap\":\"link:/opt/las-dsh-plugins/dsh-auth-bootstrap\"},\"dsh\":{\"profile\":{\"bundles\":[\"dshmarket\",\"dsh-better-sidebar\",\"example-plugin\",\"las-dsh-auth-bootstrap\"]}}}\n"
            mode: '0600'

        - name: Install the configured plugins for the second time
          ansible.builtin.include_tasks: ../roles/deepseek_harness/tasks/uninstall_web_plugins.yml

        - name: Install the configured plugins for the second time
          ansible.builtin.include_tasks: ../roles/deepseek_harness/tasks/install_web_plugins.yml

        - name: Read the second installation log
          ansible.builtin.slurp:
            src: "{{ dsh_state_dir }}/plugin-install.log"
          register: second_plugin_install_log

        - name: Read the second pnpm resolution mode log
          ansible.builtin.slurp:
            src: "{{ dsh_state_dir }}/resolution-mode.log"
          register: second_pnpm_resolution_mode_log

        - name: Verify the second run is idempotent
          ansible.builtin.assert:
            that:
              - "(second_plugin_install_log.content | b64decode).splitlines() == (first_plugin_install_log.content | b64decode).splitlines() + ['dlx --allow-build=node-pty --allow-build=@deepseek-ai/dsh-subprocess-local --allow-build=koffi --allow-build=@google/genai --allow-build=protobufjs @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile web remove dshmarket']"
              - "(second_pnpm_resolution_mode_log.content | b64decode).splitlines() == ['time-based', 'time-based', 'time-based', 'time-based', 'time-based', 'time-based']"
      always:
        - name: Remove the temporary Web Profile test workspace
          ansible.builtin.file:
            path: "{{ web_plugin_test_root.path }}"
            state: absent
