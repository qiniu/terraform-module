---
dsh_port: 3080
dsh_user: dsh
dsh_group: dsh
dsh_home: /home/dsh
dsh_state_dir: "{{ dsh_home }}/.dsh"
dsh_pnpm_store_dir: "{{ dsh_home }}/.pnpm-store"
dsh_workspace_dir: "{{ dsh_home }}/workspace"
static_preview_dir: "{{ dsh_home }}/.las-static-preview"
dsh_download_dir: /var/cache/deepseek-harness
dsh_npm_cache_dir: /var/cache/deepseek-harness/npm
code_server_port: 3083
filebrowser_port: 3085
filebrowser_source_name: dsh-home
filebrowser_state_dir: "{{ dsh_home }}/.filebrowser"
filebrowser_token_path: "{{ filebrowser_state_dir }}/agent-api-token"
dsh_skills:
  # 发现、检索并选择适合当前任务的 Agent Skill
  - name: find-skills
    source: https://github.com/vercel-labs/skills
  # 创建、评估和改进 Agent Skill
  - name: skill-creator
    source: https://github.com/anthropics/skills
  # 设计具有明确视觉方向的高质量前端界面
  - name: frontend-design
    source: https://github.com/anthropics/skills
  # 获取最新的库文档、API 参考与代码示例
  - name: context7-cli
    source: https://github.com/upstash/context7
  # 查询和理解公开 GitHub 仓库的文档与源码
  - name: mcp-deepwiki
    source: https://github.com/aahl/skills
  # 以简洁、谨慎和可验证为原则编写与审查代码
  - name: karpathy-guidelines
    source: https://github.com/multica-ai/andrej-karpathy-skills
  - name: agent-browser
    source: https://github.com/vercel-labs/agent-browser
