filebrowser_database_path: "{{ filebrowser_state_dir }}/database.db"
filebrowser_token_path: "{{ filebrowser_state_dir }}/agent-api-token"
filebrowser_token_name: las-filebrowser-agent
filebrowser_token_days: 3652
filebrowser_release:
  x86_64:
    asset: linux-amd64-filebrowser
    sha256: 2cc7c2e39fc24831578fdb4da02c5dfeb39669203fc8c6d6bfbbfa35577f5173
  aarch64:
    asset: linux-arm64-filebrowser
    sha256: 19d386b2ca721cacbe3c685edb8d049d040f8eaef9b168b5ea705d8f2666a011
dsh_skills:
  - name: find-skills
    source: https://github.com/vercel-labs/skills
