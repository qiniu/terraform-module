---
dsh_port: 3080
dsh_user: dsh
dsh_group: dsh
dsh_home: /home/dsh
dsh_state_dir: "{{ dsh_home }}/.dsh"
dsh_pnpm_store_dir: "{{ dsh_home }}/.pnpm-store"
dsh_workspace_dir: "{{ dsh_home }}/workspace"
dsh_web_plugins_to_remove:
  - "@qiniu/dsh-qiniu-maas-plugin"
dsh_web_plugins:
  - dshmarket
  - dsh-better-sidebar
  - https://github.com/zhangzqs/dsh-qiniu-maas-plugin/releases/download/v0.1.6-rc.0/qiniu-dsh-qiniu-maas-plugin-0.1.6-rc.0.tgz
static_preview_dir: "{{ dsh_home }}/.las-static-preview"
dsh_download_dir: /var/cache/deepseek-harness
dsh_npm_cache_dir: /var/cache/deepseek-harness/npm
nodejs_version: 24.19.0
pnpm_version: 11.22.0
code_server_version: 4.132.0
code_server_releases:
  x86_64:
    archive: "code-server-{{ code_server_version }}-linux-amd64.tar.gz"
    sha256: a38d26f4cb81f768feddff79e2937fd3f39c83d3da8be3da7225e1087e62e4ed
  aarch64:
    archive: "code-server-{{ code_server_version }}-linux-arm64.tar.gz"
    sha256: ade569a677d1c04ee66ef153382b7e15bf261f955407663c7ddc6b87f9ee29fc
code_server_port: 3083
filebrowser_version: v2.0.3-beta
filebrowser_port: 3085
filebrowser_source_name: dsh-home
filebrowser_state_dir: "{{ dsh_home }}/.filebrowser"
filebrowser_token_path: "{{ filebrowser_state_dir }}/agent-api-token"
filebrowser_release:
  x86_64:
    asset: linux-amd64-filebrowser
    sha256: fb6b4719cb0b16520e981eb963db48bc9f4f2d6df84571b5395eca3ea3102c9a
  aarch64:
    asset: linux-arm64-filebrowser
    sha256: 08585786bfcf248aa8d13531ee9acc8bd9168556546d2aecdc460cde728d9adc
dsh_skills:
  # 发现、检索并选择适合当前任务的 Agent Skill
  - name: find-skills
    source: https://github.com/vercel-labs/skills
  # 创建、评估和改进 Agent Skill
  - name: skill-creator
    source: https://github.com/anthropics/skills
  # 设计具有明确视觉方向的高质量前端界面
  - name: frontend-design
    source: https://github.com/anthropics/skills
  # 获取最新的库文档、API 参考与代码示例
  - name: context7-cli
    source: https://github.com/upstash/context7
  # 查询和理解公开 GitHub 仓库的文档与源码
  - name: mcp-deepwiki
    source: https://github.com/aahl/skills
  # 以简洁、谨慎和可验证为原则编写与审查代码
  - name: karpathy-guidelines
    source: https://github.com/multica-ai/andrej-karpathy-skills
