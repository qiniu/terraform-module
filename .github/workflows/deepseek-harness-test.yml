name: DeepSeek Harness Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/deepseek-harness/**'
      - '.github/actions/setup-qiniu-terraform/**'
      - '.github/workflows/deepseek-harness-test.yml'
  pull_request:
    paths:
      - 'apps/deepseek-harness/**'
      - '.github/actions/setup-qiniu-terraform/**'
      - '.github/workflows/deepseek-harness-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: DeepSeek Harness Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14'

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'

      - uses: ./.github/actions/setup-qiniu-terraform

      - name: Test root module
        working-directory: apps/deepseek-harness
        run: |
          terraform init
          terraform validate
          terraform test -no-color

      - name: Test nested Terraform modules
        working-directory: apps/deepseek-harness
        run: |
          terraform -chdir=modules/infrastructure init
          terraform -chdir=modules/infrastructure validate
          terraform -chdir=modules/infrastructure test -no-color

      - name: Test Ansible bootstrap installer
        working-directory: apps/deepseek-harness
        run: |
          terraform -chdir="modules/ansible-installer" init
          terraform -chdir="modules/ansible-installer" validate
          terraform -chdir="modules/ansible-installer" test -no-color

      - name: Test bundled Ansible runtime
        working-directory: apps/deepseek-harness/modules/ansible-installer/ansible
        run: |
          uv run --locked ansible-playbook --syntax-check -i inventory/default playbooks/site.yml
          uv run --locked ansible-playbook -i localhost, tests/render_las_dsh_environment.yml
          uv run --locked ansible-playbook -i localhost, tests/static_preview.yml
          uv run --locked ansible-playbook -i localhost, tests/preview_port_claim.yml
