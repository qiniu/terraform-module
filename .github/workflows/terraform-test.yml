name: Terraform Module Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tftest.hcl'
      - 'pkg/instance-exec-file-transfer/**'
      - '.github/workflows/terraform-test.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tftest.hcl'
      - 'pkg/instance-exec-file-transfer/**'
      - '.github/workflows/terraform-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: 'Test ${{ matrix.module }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - openclaw
          - apps/ci-runner/single
          - pkg/instance-exec-file-transfer
          - pkg/instance-exec-file-transfer/modules/direct
          - pkg/instance-exec-file-transfer/modules/chunked

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14'

      - name: Cache qiniu provider
        id: cache-provider
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-mirror
          key: qiniu-provider-1.0.0-linux-amd64-sha256-e2d367648b55

      - name: Install qiniu provider
        if: steps.cache-provider.outputs.cache-hit != 'true'
        run: |
          MIRROR_DIR="${HOME}/.terraform.d/plugin-mirror/registry.terraform.io/qiniu/qiniu/1.0.0/linux_amd64"
          PROVIDER_SHA256="e2d367648b559829632767ab372a1eb6693bbf2bef92af63c25722759b65c6eb"
          mkdir -p "${MIRROR_DIR}"
          PROVIDER_TMP="$(mktemp "${MIRROR_DIR}/.terraform-provider-qiniu.XXXXXX")"
          trap 'rm -f "${PROVIDER_TMP}"' EXIT

          curl -fsSL \
            --retry 5 \
            --retry-delay 10 \
            --retry-max-time 300 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o "${PROVIDER_TMP}" \
            "http://srz5669lx.hn-bkt.clouddn.com/terraformprovider/registry.terraform.io/qiniu/qiniu/1.0.0/linux_amd64/terraform-provider-qiniu"

          printf '%s  %s\n' "${PROVIDER_SHA256}" "${PROVIDER_TMP}" | sha256sum -c -
          chmod +x "${PROVIDER_TMP}"
          mv "${PROVIDER_TMP}" "${MIRROR_DIR}/terraform-provider-qiniu"

      - name: Configure Terraform provider mirror
        run: |
          mkdir -p "${HOME}/.terraform.d/plugin-cache"

          cat > "${HOME}/.terraformrc" << EOF
          plugin_cache_dir = "${HOME}/.terraform.d/plugin-cache"

          provider_installation {
            filesystem_mirror {
              path    = "${HOME}/.terraform.d/plugin-mirror"
              include = ["registry.terraform.io/qiniu/qiniu"]
            }
            direct {
              exclude = ["registry.terraform.io/qiniu/qiniu"]
            }
          }
          EOF

      - name: Run terraform test
        working-directory: ${{ matrix.module }}
        run: |
          if ls *.tftest.hcl 1>/dev/null 2>&1; then
            terraform init
            terraform validate
            terraform test -no-color
          else
            echo "::notice::No test files in ${{ matrix.module }}, skipping"
          fi

      - name: Test instance exec file transfer contract
        if: matrix.module == 'pkg/instance-exec-file-transfer'
        run: bash pkg/instance-exec-file-transfer/tests/contract.sh
